<%+header%>

<h2><%:代理池 - 状态监控%></h2>

<style>
.status-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

.status-table th, .status-table td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

.status-table th {
    background: #f5f5f5;
}

.status-indicator {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
}

.status-indicator.connected { background: #28a745; }
.status-indicator.connecting { background: #ffc107; }
.status-indicator.disconnected { background: #dc3545; }
.status-indicator.disabled { background: #6c757d; }

.action-btn {
    padding: 4px 8px;
    margin: 0 2px;
    font-size: 12px;
}

.traffic-bar {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: #666;
}

.traffic-rx { color: #28a745; }
.traffic-tx { color: #007bff; }

.devices-section {
    margin-top: 30px;
}

.device-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 10px;
}

.device-item {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.device-item.online {
    border-left: 3px solid #28a745;
}

.device-item.offline {
    border-left: 3px solid #dc3545;
    opacity: 0.6;
}

.device-ip {
    font-weight: bold;
}

.device-client {
    font-size: 12px;
    color: #666;
}

.refresh-time {
    text-align: right;
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}
</style>

<div class="refresh-time">
    <%:最后更新%>: <span id="last-update">-</span>
    <button class="cbi-button" onclick="refreshStatus()"><%:刷新%></button>
</div>

<h3><%:客户端状态%></h3>
<table class="status-table" id="clients-table">
    <thead>
        <tr>
            <th style="width:5%"><%:状态%></th>
            <th style="width:10%"><%:名称%></th>
            <th style="width:8%"><%:类型%></th>
            <th style="width:15%"><%:服务器%></th>
            <th style="width:12%"><%:IP%></th>
            <th style="width:20%"><%:流量%></th>
            <th style="width:15%"><%:绑定设备%></th>
            <th style="width:15%"><%:操作%></th>
        </tr>
    </thead>
    <tbody>
        <tr><td colspan="8" style="text-align:center"><%:加载中...%></td></tr>
    </tbody>
</table>

<div class="devices-section">
    <h3><%:绑定设备%></h3>
    <div class="device-list" id="device-list">
        <div style="text-align:center; padding:20px; color:#666;"><%:加载中...%></div>
    </div>
</div>

<script>
function refreshStatus() {
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "proxypool", "api")%>?action=status', null, function(x, data) {
        if (data) {
            document.getElementById('last-update').textContent = data.datetime;

            // 更新客户端表格
            var tbody = document.querySelector('#clients-table tbody');
            tbody.innerHTML = '';

            data.clients.forEach(function(client) {
                var tr = document.createElement('tr');

                var statusClass = client.status;
                var statusText = {
                    'connected': '已连接',
                    'connecting': '连接中',
                    'disconnected': '未连接',
                    'disabled': '已禁用'
                }[client.status] || client.status;

                var bindIps = client.bind_ips || '-';

                tr.innerHTML = '<td><span class="status-indicator ' + statusClass + '"></span>' + statusText + '</td>' +
                    '<td>' + client.name + '</td>' +
                    '<td>' + client.type.toUpperCase() + '</td>' +
                    '<td>' + client.server + ':' + client.port + '</td>' +
                    '<td>' + (client.ip || '-') + '</td>' +
                    '<td><div class="traffic-bar"><span class="traffic-rx">↓ ' + client.rx_human + '</span><span class="traffic-tx">↑ ' + client.tx_human + '</span></div></td>' +
                    '<td style="font-size:11px">' + bindIps + '</td>' +
                    '<td>' +
                        '<button class="cbi-button action-btn" onclick="clientAction(\'' + client.id + '\', \'restart\')">重启</button>' +
                        (client.enabled ? '<button class="cbi-button action-btn" onclick="clientAction(\'' + client.id + '\', \'stop\')">停止</button>' : '<button class="cbi-button action-btn" onclick="clientAction(\'' + client.id + '\', \'start\')">启动</button>') +
                    '</td>';

                tbody.appendChild(tr);
            });

            // 更新设备列表
            var deviceList = document.getElementById('device-list');
            deviceList.innerHTML = '';

            if (data.devices && data.devices.length > 0) {
                data.devices.forEach(function(device) {
                    var div = document.createElement('div');
                    div.className = 'device-item ' + (device.online ? 'online' : 'offline');
                    div.innerHTML = '<div><div class="device-ip">' + device.ip + '</div><div class="device-client">' + device.client_name + '</div></div>' +
                        '<div>' + (device.online ? '<span style="color:#28a745">●</span> 在线' : '<span style="color:#dc3545">○</span> 离线') + '</div>';
                    deviceList.appendChild(div);
                });
            } else {
                deviceList.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">暂无绑定设备</div>';
            }
        }
    });
}

function clientAction(clientId, action) {
    var apiAction = action + '_client';
    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "proxypool", "api")%>?action=' + apiAction + '&client=' + clientId, null, function(x, data) {
        if (data && data.success) {
            setTimeout(refreshStatus, 2000);
        }
    });
}

// 初始加载
refreshStatus();

// 定时刷新
setInterval(refreshStatus, 10000);
</script>

<%+footer%>
