<%+header%>

<h2><%:代理池 - 日志%></h2>

<style>
.log-controls {
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.log-container {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    padding: 15px;
    border-radius: 4px;
    height: 500px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.log-line {
    line-height: 1.5;
}

.log-line .timestamp {
    color: #6a9955;
}

.log-line .level-info {
    color: #569cd6;
}

.log-line .level-warn {
    color: #ce9178;
}

.log-line .level-error {
    color: #f44747;
}

.log-line .component {
    color: #dcdcaa;
}

.auto-scroll {
    display: flex;
    align-items: center;
    gap: 5px;
}
</style>

<div class="log-controls">
    <label>
        <%:显示行数%>:
        <select id="log-lines" onchange="refreshLog()">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
        </select>
    </label>

    <button class="cbi-button" onclick="refreshLog()"><%:刷新%></button>
    <button class="cbi-button" onclick="clearLog()"><%:清空%></button>
    <button class="cbi-button" onclick="downloadLog()"><%:下载%></button>

    <div class="auto-scroll">
        <input type="checkbox" id="auto-refresh" checked>
        <label for="auto-refresh"><%:自动刷新%></label>
    </div>

    <div class="auto-scroll">
        <input type="checkbox" id="auto-scroll" checked>
        <label for="auto-scroll"><%:自动滚动%></label>
    </div>
</div>

<div class="log-container" id="log-container">
    <%:加载中...%>
</div>

<script>
var refreshTimer = null;

function formatLogLine(line) {
    // 匹配日志格式: [2024-01-01 12:00:00] [level] [component] message
    var match = line.match(/^\[([^\]]+)\]\s*\[([^\]]+)\]\s*(?:\[([^\]]+)\])?\s*(.*)$/);

    if (match) {
        var timestamp = match[1];
        var level = match[2].toLowerCase();
        var component = match[3] || '';
        var message = match[4];

        var levelClass = 'level-' + level;

        var html = '<span class="timestamp">[' + timestamp + ']</span> ';
        html += '<span class="' + levelClass + '">[' + level + ']</span> ';
        if (component) {
            html += '<span class="component">[' + component + ']</span> ';
        }
        html += message;

        return '<div class="log-line">' + html + '</div>';
    }

    return '<div class="log-line">' + line + '</div>';
}

function refreshLog() {
    var lines = document.getElementById('log-lines').value;

    XHR.get('<%=luci.dispatcher.build_url("admin", "services", "proxypool", "api")%>?action=log&lines=' + lines, null, function(x, data) {
        var container = document.getElementById('log-container');

        if (data) {
            var logLines = data.split('\n');
            var html = '';

            logLines.forEach(function(line) {
                if (line.trim()) {
                    html += formatLogLine(line);
                }
            });

            container.innerHTML = html || '<div class="log-line">暂无日志</div>';

            // 自动滚动到底部
            if (document.getElementById('auto-scroll').checked) {
                container.scrollTop = container.scrollHeight;
            }
        }
    });
}

function clearLog() {
    if (confirm('确定要清空日志吗？')) {
        XHR.get('<%=luci.dispatcher.build_url("admin", "services", "proxypool", "api")%>?action=clear_log', null, function(x, data) {
            refreshLog();
        });
    }
}

function downloadLog() {
    window.location.href = '<%=luci.dispatcher.build_url("admin", "services", "proxypool", "api")%>?action=download_log';
}

function startAutoRefresh() {
    if (refreshTimer) {
        clearInterval(refreshTimer);
    }

    if (document.getElementById('auto-refresh').checked) {
        refreshTimer = setInterval(refreshLog, 5000);
    }
}

document.getElementById('auto-refresh').addEventListener('change', startAutoRefresh);

// 初始加载
refreshLog();
startAutoRefresh();
</script>

<%+footer%>
