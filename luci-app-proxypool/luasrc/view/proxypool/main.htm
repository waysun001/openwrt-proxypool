<%+header%>
<link rel="stylesheet" href="<%=resource%>/proxypool-v2.css" />

<div id="pp-v2-app" class="pp-v2-app"
     data-api-read="<%=url([[admin]], [[services]], [[proxypool]], [[api]], [[read]])%>"
     data-api-write="<%=url([[admin]], [[services]], [[proxypool]], [[api]], [[write]])%>"
     data-token="<%=token%>">
    <div class="pp-v2-header">
        <div>
            <h2>ProxyPool V2</h2>
            <p>设备只能通过已绑定节点上网；局域网互访、IPv6 和本地 WAN 回退保持禁止。</p>
        </div>
        <div id="pp-v2-revision" class="pp-v2-revision"></div>
    </div>

    <div id="pp-v2-error" class="pp-v2-error" role="alert"></div>

    <div class="pp-v2-summary">
        <div><span>节点</span><strong id="pp-v2-total">-</strong></div>
        <div><span>在线</span><strong id="pp-v2-online">-</strong></div>
        <div><span>已绑定设备</span><strong id="pp-v2-bound">-</strong></div>
    </div>

    <div class="pp-v2-tabs" role="tablist">
        <button type="button" class="active" data-pp-tab="nodes">节点</button>
        <button type="button" data-pp-tab="devices">设备</button>
        <button type="button" data-pp-tab="jobs">任务</button>
    </div>

    <section data-pp-panel="nodes">
        <div class="pp-v2-toolbar">
            <div><h3>节点管理</h3><p>当前可拨号协议为 L2TP；账号和密码不会回显。</p></div>
            <button id="pp-v2-add-node" type="button" class="cbi-button cbi-button-add">新增节点</button>
        </div>
        <div class="pp-v2-table-wrap">
            <table class="table pp-v2-table">
                <thead><tr><th>名称</th><th>服务器</th><th>协议</th><th>状态</th><th>错误</th><th>重试</th><th>绑定数</th><th>策略</th><th>操作</th></tr></thead>
                <tbody id="pp-v2-node-list"></tbody>
            </table>
        </div>
    </section>

    <section data-pp-panel="devices" hidden>
        <div class="pp-v2-toolbar">
            <div><h3>设备发现与绑定</h3><p>LAN 口和 WiFi 终端按 DHCP/邻居信息自动识别 MAC，无需手工输入。</p></div>
        </div>
        <div class="pp-v2-table-wrap">
            <table class="table pp-v2-table">
                <thead><tr><th>设备 / MAC</th><th>当前 IP</th><th>固定 IP</th><th>入口</th><th>绑定节点</th><th>操作</th></tr></thead>
                <tbody id="pp-v2-device-list"></tbody>
            </table>
        </div>
    </section>

    <section data-pp-panel="jobs" hidden>
        <div class="pp-v2-toolbar">
            <div><h3>后台任务</h3><p>任务由路由器后台执行，刷新或关闭页面不会取消拨号与清理。</p></div>
        </div>
        <div id="pp-v2-job-list" class="pp-v2-jobs"></div>
    </section>

    <div id="pp-v2-node-modal" class="pp-v2-modal" hidden>
        <div class="pp-v2-dialog" role="dialog" aria-modal="true" aria-labelledby="pp-v2-node-modal-title">
            <h3 id="pp-v2-node-modal-title">新增 L2TP 节点</h3>
            <form id="pp-v2-node-form">
                <input type="hidden" name="node_id" />
                <div class="pp-v2-form-grid">
                    <label>名称<input name="name" maxlength="128" required /></label>
                    <label>协议<select name="protocol" disabled><option value="l2tp">L2TP</option></select></label>
                    <label>服务器<input name="server" maxlength="253" required /></label>
                    <label>端口<input name="port" type="number" min="1" max="65535" value="1701" required /></label>
                    <label>用户名<input name="username" maxlength="1024" autocomplete="off" placeholder="编辑时留空表示保留" /></label>
                    <label>密码<input name="password" type="password" maxlength="4096" autocomplete="new-password" placeholder="编辑时留空表示保留" /></label>
                    <label>到期日期<input name="expires_at" type="date" /></label>
                    <label class="pp-v2-checkbox"><input name="enabled" type="checkbox" checked /> 保存后启用</label>
                </div>
                <div class="pp-v2-dialog-actions">
                    <button id="pp-v2-node-cancel" type="button" class="cbi-button">取消</button>
                    <button type="submit" class="cbi-button cbi-button-save">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script type="text/javascript" src="<%=resource%>/proxypool-v2.js"></script>
<%+footer%>
