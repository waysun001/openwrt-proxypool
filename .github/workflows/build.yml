name: Build GL-MT6000 firmware with pinned custom kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: '23.05.3'
  OPENWRT_COMMIT: 01170d518da1c8ade9d26e56d0135d12cda8e781
  PACKAGES_FEED_COMMIT: 063b2393cbc3e5aab9d2b40b2911cab1c3967c59
  LUCI_FEED_COMMIT: b07cf9dcfc37e021e5619a41c847e63afbd5d34a
  ROUTING_FEED_COMMIT: 648753932d5a7deff7f2bdb33c000018a709ad84
  TELEPHONY_FEED_COMMIT: 86af194d03592121f5321474ec9918dd109d3057
  REPO_URL: https://github.com/openwrt/openwrt.git
  TARGET: mediatek
  SUBTARGET: filogic

jobs:
  host:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: proxypool-core/src/proxypoold/go.mod
      - name: Prepare pinned OpenWrt 23.05.3 nft checker
        env:
          OPENWRT_NFT_ROOTFS: ${{ runner.temp }}/openwrt-23.05.3-x86-64-rootfs
        run: |
          sh ./scripts/prepare-openwrt-nft.sh "$OPENWRT_NFT_ROOTFS"
          chmod 755 "$GITHUB_WORKSPACE/scripts/openwrt-target-nft.sh"
          {
            echo "PROXYPOOL_OPENWRT_ROOTFS=$OPENWRT_NFT_ROOTFS"
            echo "PROXYPOOL_TARGET_NFT=$GITHUB_WORKSPACE/scripts/openwrt-target-nft.sh"
          } >> "$GITHUB_ENV"
      - name: Run focused status JSON gate
        run: sh ./scripts/test-status-readonly.sh
      - name: Run host gates first
        run: ./scripts/test-host.sh
      - name: Check pushed commit range
        env:
          EVENT_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)
          fi
          sh ./scripts/check-whitespace-range.sh "$base" "$EVENT_HEAD_SHA"

  build:
    needs: host
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout ProxyPool
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libelf-dev libncurses5-dev libssl-dev \
            python3 python3-distutils python3-ply rsync swig unzip zlib1g-dev \
            file wget xsltproc

      - name: Checkout pinned OpenWrt source
        run: |
          mkdir openwrt
          git -C openwrt init
          git -C openwrt remote add origin "$REPO_URL"
          source_fetched=0
          for attempt in 1 2 3; do
            if git -C openwrt fetch --filter=blob:none --depth 1 origin "$OPENWRT_COMMIT"; then
              source_fetched=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 15
          done
          [ "$source_fetched" = "1" ] || {
            echo 'pinned OpenWrt source fetch failed after 3 attempts' >&2
            exit 1
          }
          cd openwrt
          git checkout --detach "$OPENWRT_COMMIT"
          [ "$(git rev-parse HEAD)" = "$OPENWRT_COMMIT" ]
          git rev-parse HEAD > ../openwrt-commit.txt

      - name: Configure pinned source feeds
        run: |
          mkdir -p local-feed
          cp -a proxypool-core luci-app-proxypool luci-theme-proxypool local-feed/
          printf '%s\n' \
            "src-git packages https://git.openwrt.org/feed/packages.git^$PACKAGES_FEED_COMMIT" \
            "src-git luci https://git.openwrt.org/project/luci.git^$LUCI_FEED_COMMIT" \
            "src-git routing https://git.openwrt.org/feed/routing.git^$ROUTING_FEED_COMMIT" \
            "src-git telephony https://git.openwrt.org/feed/telephony.git^$TELEPHONY_FEED_COMMIT" \
            "src-link proxypool $GITHUB_WORKSPACE/local-feed" \
            > openwrt/feeds.conf.default
          cd openwrt
          feed_updated=0
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              feed_updated=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 10
          done
          [ "$feed_updated" = "1" ] || {
            echo 'feeds update failed after 3 attempts' >&2
            exit 1
          }
          [ "$(git -C feeds/packages rev-parse HEAD)" = "$PACKAGES_FEED_COMMIT" ]
          [ "$(git -C feeds/luci rev-parse HEAD)" = "$LUCI_FEED_COMMIT" ]
          [ "$(git -C feeds/routing rev-parse HEAD)" = "$ROUTING_FEED_COMMIT" ]
          [ "$(git -C feeds/telephony rev-parse HEAD)" = "$TELEPHONY_FEED_COMMIT" ]
          mkdir -p ../build-evidence
          printf '%s\n' \
            "packages $PACKAGES_FEED_COMMIT" \
            "luci $LUCI_FEED_COMMIT" \
            "routing $ROUTING_FEED_COMMIT" \
            "telephony $TELEPHONY_FEED_COMMIT" \
            > ../build-evidence/feed-commits.txt
          ./scripts/feeds install -a
          ./scripts/feeds install -p proxypool proxypool-core luci-app-proxypool luci-theme-proxypool

      - name: Stage image overlay and build configuration
        run: |
          sh ./scripts/prepare-image-files.sh files image-files
          mkdir -p openwrt/files
          cp -a image-files/. openwrt/files/
          cp config/gl-mt6000.config openwrt/.config
          cd openwrt
          make defconfig
          grep -Fqx 'CONFIG_PACKAGE_proxypool-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_luci-app-proxypool=y' .config
          grep -Fqx 'CONFIG_PACKAGE_luci-theme-proxypool=y' .config

      - name: Install the two MT7531 isolation patches
        run: |
          cd openwrt
          mapfile -t kernel_patches < <(find ../openwrt-patches/23.05.3 -maxdepth 1 -type f -name '*.patch')
          [ "${#kernel_patches[@]}" -eq 2 ]
          [ -f ../openwrt-patches/23.05.3/998-net-bridge-offload-br-isolated.patch ]
          [ ! -L ../openwrt-patches/23.05.3/998-net-bridge-offload-br-isolated.patch ]
          [ -f ../openwrt-patches/23.05.3/999-net-dsa-mt7530-bridge-port-isolation.patch ]
          [ ! -L ../openwrt-patches/23.05.3/999-net-dsa-mt7530-bridge-port-isolation.patch ]
          cp \
            ../openwrt-patches/23.05.3/998-net-bridge-offload-br-isolated.patch \
            ../openwrt-patches/23.05.3/999-net-dsa-mt7530-bridge-port-isolation.patch \
            target/linux/generic/backport-5.15/

      - name: Download source archives
        run: |
          cd openwrt
          make download -j8
          if find dl -type f -size -1024c -print | grep -q .; then
            echo 'OpenWrt download directory contains truncated files' >&2
            exit 1
          fi

      - name: Compile complete firmware and verify the custom target kernel
        run: |
          set -o pipefail
          mkdir -p build-evidence
          cd openwrt
          make -j"$(nproc)" V=s 2>&1 | tee ../build-evidence/firmware-build.log
          sh ../scripts/verify-openwrt-kernel-isolation.sh . ../openwrt-patches/23.05.3 2>&1 |
            tee ../build-evidence/kernel-isolation-verification.log
          sha256sum ../openwrt-patches/23.05.3/*.patch > ../build-evidence/kernel-patches.sha256
          cp .config ../build-evidence/openwrt.config
          cp ../openwrt-commit.txt ../build-evidence/

      - name: Inspect unique packages and collect GL-MT6000 evidence
        run: |
          cd openwrt
          mapfile -t packages < <(find bin -type f -name 'proxypool-core_*.ipk')
          [ "${#packages[@]}" -eq 1 ]
          sh ../scripts/inspect-ipk.sh "${packages[0]}" aarch64_cortex-a53
          mapfile -t luci_packages < <(find bin -type f -name 'luci-app-proxypool_*.ipk')
          [ "${#luci_packages[@]}" -eq 1 ]
          sh ../scripts/inspect-luci-ipk.sh "${luci_packages[0]}"
          mapfile -t theme_packages < <(find bin -type f -name 'luci-theme-proxypool_*.ipk')
          [ "${#theme_packages[@]}" -eq 1 ]
          sh ../scripts/inspect-theme-ipk.sh "${theme_packages[0]}"
          mapfile -t firmware < <(
            find "bin/targets/$TARGET/$SUBTARGET" -maxdepth 1 -type f \
              -name '*glinet_gl-mt6000*squashfs-sysupgrade.bin'
          )
          [ "${#firmware[@]}" -eq 1 ]

          mkdir -p ../firmware-evidence
          cp "${packages[0]}" "${luci_packages[0]}" "${theme_packages[0]}" "${firmware[0]}" ../firmware-evidence/
          cp ../build-evidence/* ../firmware-evidence/
          sh ../scripts/regenerate-sha256sums.sh ../firmware-evidence

      - name: Upload custom-kernel build evidence
        uses: actions/upload-artifact@v4
        with:
          name: proxypool-gl-mt6000-custom-kernel-${{ github.sha }}
          path: firmware-evidence/
          if-no-files-found: error
