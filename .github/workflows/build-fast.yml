name: Build ProxyPool firmware (OpenWrt 23.05.3)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OPENWRT_VERSION: '23.05.3'
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE_PROFILE: glinet_gl-mt6000
  SDK_FILE: openwrt-sdk-23.05.3-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
  SDK_SHA256: e51af2eff648e0f6ee8d8a918ed0973105a11daa9fe63e31eb52e315ca852fe5
  IMAGEBUILDER_FILE: openwrt-imagebuilder-23.05.3-mediatek-filogic.Linux-x86_64.tar.xz
  IMAGEBUILDER_SHA256: 3fbe4df2261718d7824fc71eb0b063e4711bc2614ec89556b314df3996e8dddb

jobs:
  host:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: proxypool-core/src/proxypoold/go.mod
      - name: Run host gates first
        run: ./scripts/test-host.sh
      - name: Check pushed or proposed commit range
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)
          fi
          sh ./scripts/check-whitespace-range.sh "$base" "$EVENT_HEAD_SHA"

  build:
    needs: host
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget xsltproc

      - name: Download pinned OpenWrt SDK
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          curl --fail --location --retry 3 --output "$SDK_FILE" "$base_url/$SDK_FILE"
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_FILE" | sha256sum -c -
          tar -xf "$SDK_FILE"
          mv "${SDK_FILE%.tar.xz}" sdk

      - name: Prepare package feeds and local sources
        run: |
          mkdir -p sdk/package/proxypool
          cp -r proxypool-core sdk/package/proxypool/
          cp -r luci-app-proxypool sdk/package/proxypool/
          cd sdk
          feed_updated=0
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              feed_updated=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 10
          done
          [ "$feed_updated" = "1" ] || {
            echo 'feeds update failed after 3 attempts' >&2
            exit 1
          }
          ./scripts/feeds install -a
          printf '%s\n' \
            'CONFIG_PACKAGE_proxypool-core=m' \
            'CONFIG_PACKAGE_luci-app-proxypool=m' >>.config
          make defconfig

      - name: Clean-build core package with verbose proof
        run: |
          set -o pipefail
          cd sdk
          make package/proxypool/proxypool-core/clean
          make package/proxypool/proxypool-core/compile V=s -j1 2>&1 | tee ../proxypool-core-build.log

      - name: Clean-build LuCI package
        run: |
          set -o pipefail
          cd sdk
          make package/proxypool/luci-app-proxypool/clean
          make package/proxypool/luci-app-proxypool/compile V=s -j1 2>&1 | tee ../luci-app-proxypool-build.log

      - name: Inspect core IPK paths, modes, and architecture
        run: |
          mapfile -t packages < <(find sdk/bin -type f -name 'proxypool-core_*.ipk')
          [ "${#packages[@]}" -eq 1 ]
          sh ./scripts/inspect-ipk.sh "${packages[0]}" aarch64_cortex-a53
          mkdir -p packages
          find sdk/bin -type f -name '*.ipk' -exec cp '{}' packages/ \;

      - name: Download matching ImageBuilder
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          curl --fail --location --retry 3 --output "$IMAGEBUILDER_FILE" "$base_url/$IMAGEBUILDER_FILE"
          printf '%s  %s\n' "$IMAGEBUILDER_SHA256" "$IMAGEBUILDER_FILE" | sha256sum -c -
          tar -xf "$IMAGEBUILDER_FILE"
          mv "${IMAGEBUILDER_FILE%.tar.xz}" imagebuilder

      - name: Build GL-MT6000 image
        run: |
          sh ./scripts/prepare-image-files.sh files image-files
          mkdir -p imagebuilder/packages
          cp packages/*.ipk imagebuilder/packages/
          cd imagebuilder
          packages='luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn'
          packages="$packages luci-lua-runtime luci-compat luci-lib-jsonc"
          packages="$packages xl2tpd ppp ppp-mod-pppol2tp kmod-l2tp kmod-pppol2tp"
          packages="$packages redsocks nftables kmod-nft-tproxy kmod-nft-socket"
          packages="$packages ip-full conntrack netcat proxypool-core luci-app-proxypool"
          make image PROFILE="$DEVICE_PROFILE" PACKAGES="$packages" FILES=../image-files V=s

      - name: Collect artifacts
        run: |
          mkdir -p output
          find imagebuilder/bin -type f \( -name '*sysupgrade*' -o -name '*factory*' \) -exec cp '{}' output/ \;
          cp proxypool-core-build.log luci-app-proxypool-build.log output/
          cp packages/*.ipk output/
          test -n "$(find output -type f -name '*sysupgrade*' -print -quit)"
          sh ./scripts/regenerate-sha256sums.sh output

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: proxypool-openwrt-23.05.3
          path: output/

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: proxypool-openwrt-23.05.3
          path: output

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-shadow-${{ github.run_number }}
          name: ProxyPool V2 shadow ${{ github.run_number }}
          files: output/*
          generate_release_notes: true
