name: Build ProxyPool packages (OpenWrt 23.05.3 SDK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: '23.05.3'
  OPENWRT_COMMIT: 01170d518da1c8ade9d26e56d0135d12cda8e781
  TARGET: mediatek
  SUBTARGET: filogic
  SDK_FILE: openwrt-sdk-23.05.3-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
  SDK_SHA256: e51af2eff648e0f6ee8d8a918ed0973105a11daa9fe63e31eb52e315ca852fe5
  PACKAGES_FEED_COMMIT: 063b2393cbc3e5aab9d2b40b2911cab1c3967c59
  LUCI_FEED_COMMIT: b07cf9dcfc37e021e5619a41c847e63afbd5d34a
  ROUTING_FEED_COMMIT: 648753932d5a7deff7f2bdb33c000018a709ad84
  TELEPHONY_FEED_COMMIT: 86af194d03592121f5321474ec9918dd109d3057

jobs:
  host:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: proxypool-core/src/proxypoold/go.mod
      - name: Prepare pinned OpenWrt 23.05.3 nft checker
        env:
          OPENWRT_NFT_ROOTFS: ${{ runner.temp }}/openwrt-23.05.3-x86-64-rootfs
        run: |
          sh ./scripts/prepare-openwrt-nft.sh "$OPENWRT_NFT_ROOTFS"
          chmod 755 "$GITHUB_WORKSPACE/scripts/openwrt-target-nft.sh"
          {
            echo "PROXYPOOL_OPENWRT_ROOTFS=$OPENWRT_NFT_ROOTFS"
            echo "PROXYPOOL_TARGET_NFT=$GITHUB_WORKSPACE/scripts/openwrt-target-nft.sh"
          } >> "$GITHUB_ENV"
      - name: Run host gates first
        run: ./scripts/test-host.sh
      - name: Check pushed or proposed commit range
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)
          fi
          sh ./scripts/check-whitespace-range.sh "$base" "$EVENT_HEAD_SHA"

  build:
    needs: host
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
            qemu-user-static rsync unzip zlib1g-dev file wget xsltproc

      - name: Download pinned OpenWrt SDK
        run: |
          base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          curl --fail --location --retry 3 --output "$SDK_FILE" "$base_url/$SDK_FILE"
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_FILE" | sha256sum -c -
          tar -xf "$SDK_FILE"
          mv "${SDK_FILE%.tar.xz}" sdk

      - name: Restore pinned OpenWrt base package sources omitted by SDK
        run: |
          mkdir openwrt-base
          git -C openwrt-base init
          git -C openwrt-base remote add origin https://git.openwrt.org/openwrt/openwrt.git
          fetched=0
          for attempt in 1 2 3; do
            if git -C openwrt-base fetch --filter=blob:none --depth 1 origin "$OPENWRT_COMMIT"; then
              fetched=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 10
          done
          [ "$fetched" = "1" ] || {
            echo 'OpenWrt base source fetch failed after 3 attempts' >&2
            exit 1
          }
          git -C openwrt-base checkout --detach FETCH_HEAD
          [ "$(git -C openwrt-base rev-parse HEAD)" = "$OPENWRT_COMMIT" ]
          sh ./scripts/prepare-sdk-base-packages.sh sdk openwrt-base

      - name: Prepare package feeds and local sources
        run: |
          mkdir -p sdk/package/proxypool
          cp -r proxypool-core sdk/package/proxypool/
          cp -r luci-app-proxypool sdk/package/proxypool/
          cp -r luci-theme-proxypool sdk/package/proxypool/
          cd sdk
          printf '%s\n' \
            "src-git packages https://git.openwrt.org/feed/packages.git^$PACKAGES_FEED_COMMIT" \
            "src-git luci https://git.openwrt.org/project/luci.git^$LUCI_FEED_COMMIT" \
            "src-git routing https://git.openwrt.org/feed/routing.git^$ROUTING_FEED_COMMIT" \
            "src-git telephony https://git.openwrt.org/feed/telephony.git^$TELEPHONY_FEED_COMMIT" \
            > feeds.conf.default
          feed_updated=0
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              feed_updated=1
              break
            fi
            [ "$attempt" -eq 3 ] || sleep 10
          done
          [ "$feed_updated" = "1" ] || {
            echo 'feeds update failed after 3 attempts' >&2
            exit 1
          }
          [ "$(git -C feeds/packages rev-parse HEAD)" = "$PACKAGES_FEED_COMMIT" ]
          [ "$(git -C feeds/luci rev-parse HEAD)" = "$LUCI_FEED_COMMIT" ]
          [ "$(git -C feeds/routing rev-parse HEAD)" = "$ROUTING_FEED_COMMIT" ]
          [ "$(git -C feeds/telephony rev-parse HEAD)" = "$TELEPHONY_FEED_COMMIT" ]
          printf '%s\n' \
            "packages $PACKAGES_FEED_COMMIT" \
            "luci $LUCI_FEED_COMMIT" \
            "routing $ROUTING_FEED_COMMIT" \
            "telephony $TELEPHONY_FEED_COMMIT" \
            > ../feed-commits.txt
          ./scripts/feeds install -a
          printf '%s\n' \
            'CONFIG_PACKAGE_proxypool-core=m' \
            'CONFIG_PACKAGE_luci-app-proxypool=m' \
            'CONFIG_PACKAGE_luci-theme-proxypool=m' >>.config
          make defconfig

      - name: Clean-build core package with verbose proof
        run: |
          set -o pipefail
          cd sdk
          make package/proxypool/proxypool-core/clean
          make package/proxypool/proxypool-core/compile V=s -j1 2>&1 | tee ../proxypool-core-build.log

      - name: Compile L2TP bridge with the target ucode runtime
        run: |
          mapfile -t ucode_bins < <(find sdk/staging_dir/target-* -path '*/root-*/usr/bin/ucode' -type f)
          [ "${#ucode_bins[@]}" -eq 1 ]
          target_root=${ucode_bins[0]%/usr/bin/ucode}
          sh ./scripts/test-ucode-l2tp-bridge.sh \
            /usr/bin/qemu-aarch64-static -L "$target_root" "${ucode_bins[0]}"

      - name: Clean-build LuCI package
        run: |
          set -o pipefail
          cd sdk
          make package/proxypool/luci-app-proxypool/clean
          make package/proxypool/luci-app-proxypool/compile V=s -j1 2>&1 | tee ../luci-app-proxypool-build.log

      - name: Clean-build ProxyPool theme package
        run: |
          set -o pipefail
          cd sdk
          make package/proxypool/luci-theme-proxypool/clean
          make package/proxypool/luci-theme-proxypool/compile V=s -j1 2>&1 | tee ../luci-theme-proxypool-build.log

      - name: Inspect unique core and LuCI IPK payloads
        run: |
          mapfile -t packages < <(find sdk/bin -type f -name 'proxypool-core_*.ipk')
          [ "${#packages[@]}" -eq 1 ]
          sh ./scripts/inspect-ipk.sh "${packages[0]}" aarch64_cortex-a53
          mapfile -t luci_packages < <(find sdk/bin -type f -name 'luci-app-proxypool_*.ipk')
          [ "${#luci_packages[@]}" -eq 1 ]
          sh ./scripts/inspect-luci-ipk.sh "${luci_packages[0]}"
          mapfile -t theme_packages < <(find sdk/bin -type f -name 'luci-theme-proxypool_*.ipk')
          [ "${#theme_packages[@]}" -eq 1 ]
          sh ./scripts/inspect-theme-ipk.sh "${theme_packages[0]}"

          mkdir -p package-evidence
          cp "${packages[0]}" "${luci_packages[0]}" "${theme_packages[0]}" package-evidence/
          cp proxypool-core-build.log luci-app-proxypool-build.log luci-theme-proxypool-build.log feed-commits.txt package-evidence/
          sh ./scripts/regenerate-sha256sums.sh package-evidence

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: proxypool-packages-openwrt-23.05.3
          path: package-evidence/
          if-no-files-found: error
