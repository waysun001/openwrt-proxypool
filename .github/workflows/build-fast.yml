name: Build 智联盒子 (Fast - ImageBuilder)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt版本'
        required: true
        default: '23.05.3'
        type: choice
        options:
          - '23.05.3'
          - '23.05.2'

permissions:
  contents: write

env:
  OPENWRT_VERSION: '23.05.3'
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE_PROFILE: glinet_gl-mt6000
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译固件
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget xsltproc

    - name: 下载 OpenWrt SDK
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        SDK_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-sdk-[^"]+\.tar\.xz' | head -1)

        if [ -z "$SDK_FILE" ]; then
          echo "Error: Cannot find SDK file"
          exit 1
        fi

        echo "Downloading SDK: $SDK_FILE"
        wget -q "$BASE_URL/$SDK_FILE"

        echo "Extracting SDK..."
        tar -xf "$SDK_FILE"

        SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -1)
        if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR" ]; then
          mv "$SDK_DIR" sdk
        else
          echo "Error: SDK directory not found"
          exit 1
        fi

    - name: 准备软件包源码
      run: |
        mkdir -p sdk/package/proxypool
        cp -r proxypool-core sdk/package/proxypool/
        cp -r slp-client-bin sdk/package/proxypool/
        cp -r luci-app-proxypool sdk/package/proxypool/

        echo "=== 验证 slp-client 二进制 ==="
        ls -la sdk/package/proxypool/slp-client-bin/files/
        file sdk/package/proxypool/slp-client-bin/files/slp-client-linux-* || echo "WARNING: binary file not found!"

    - name: 编译软件包
      run: |
        cd sdk

        # 移除 SDK 中不可用的 feed
        sed -i '/telephony/d; /routing/d' feeds.conf.default

        # 将 git.openwrt.org 替换为 GitHub 镜像
        sed -i 's|https://git.openwrt.org/openwrt/openwrt.git|https://github.com/openwrt/openwrt.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default

        if ! grep -q '^src-git luci' feeds.conf.default; then
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-23.05" >> feeds.conf.default
        fi

        echo "=== feeds.conf.default ==="
        cat feeds.conf.default

        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        git config --global advice.detachedHead false

        # 更新 feeds（带重试）
        for attempt in 1 2 3; do
          echo "=== feeds update attempt $attempt ==="
          if ./scripts/feeds update -a; then
            break
          fi
          echo "Attempt $attempt failed, waiting 30s..."
          sleep 30
        done

        ./scripts/feeds install -a

        echo "CONFIG_PACKAGE_slp-client-bin=m" >> .config
        echo "CONFIG_PACKAGE_proxypool-core=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-proxypool=m" >> .config
        make defconfig

        # 诊断：检查 SDK 是否识别到 slp-client-bin
        echo "=== 诊断: 包目录 ==="
        ls -la package/proxypool/slp-client-bin/ || echo "MISSING!"
        ls -la package/proxypool/slp-client-bin/files/ || echo "files/ MISSING!"
        echo "=== 诊断: ARCH ==="
        grep "CONFIG_ARCH=" .config || echo "No CONFIG_ARCH"
        echo "=== 诊断: .config 中 slp 相关 ==="
        grep -i slp .config || echo "slp-client-bin NOT in .config after defconfig!"

        # 编译（V=s 只用于 slp-client-bin 方便排查）
        echo "=== 编译 slp-client-bin ==="
        make package/proxypool/slp-client-bin/compile V=s -j1

        echo "=== 编译 proxypool-core ==="
        make package/proxypool/proxypool-core/compile -j$(nproc) || make package/proxypool/proxypool-core/compile V=s -j1

        echo "=== 编译 luci-app-proxypool ==="
        make package/proxypool/luci-app-proxypool/compile -j$(nproc) || make package/proxypool/luci-app-proxypool/compile V=s -j1

        # 搜索所有 ipk
        echo "=== 搜索 IPK ==="
        find bin -name "*.ipk" -ls 2>/dev/null
        find bin -name "*slp*" -ls 2>/dev/null || echo "No slp ipk found"

        mkdir -p ../packages
        find bin -name "*.ipk" -exec cp {} ../packages/ \;

        echo "=== Built packages ==="
        ls -la ../packages/

    - name: 下载 OpenWrt ImageBuilder
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        IB_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-imagebuilder-[^"]+\.tar\.xz' | head -1)

        if [ -z "$IB_FILE" ]; then
          echo "Error: Cannot find ImageBuilder file"
          exit 1
        fi

        echo "Downloading ImageBuilder: $IB_FILE"
        wget -q "$BASE_URL/$IB_FILE"

        echo "Extracting ImageBuilder..."
        tar -xf "$IB_FILE"

        IB_DIR=$(ls -d openwrt-imagebuilder-* 2>/dev/null | head -1)
        if [ -n "$IB_DIR" ] && [ -d "$IB_DIR" ]; then
          mv "$IB_DIR" imagebuilder
        else
          echo "Error: ImageBuilder directory not found"
          exit 1
        fi

    - name: 准备自定义软件包
      run: |
        mkdir -p imagebuilder/packages
        cp packages/*.ipk imagebuilder/packages/

        echo "=== Custom packages ==="
        ls -la imagebuilder/packages/

        cd imagebuilder
        echo "src/gz custom file:packages" >> repositories.conf

    - name: 生成固件
      run: |
        cd imagebuilder

        echo "=== Available profiles ==="
        make info | grep -i gl-mt6000 || make info | head -50

        PACKAGES="luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn"
        PACKAGES="$PACKAGES luci-lua-runtime luci-compat luci-lib-jsonc"
        PACKAGES="$PACKAGES xl2tpd ppp ppp-mod-pppol2tp kmod-l2tp kmod-pppol2tp"
        PACKAGES="$PACKAGES redsocks"
        PACKAGES="$PACKAGES nftables kmod-nft-tproxy kmod-nft-socket"
        PACKAGES="$PACKAGES ip-full conntrack netcat"
        PACKAGES="$PACKAGES openssh-sftp-server nano htop"
        PACKAGES="$PACKAGES slp-client-bin proxypool-core luci-app-proxypool"

        echo "=== Custom packages available ==="
        ls -la packages/

        make image PROFILE="${{ env.DEVICE_PROFILE }}" PACKAGES="$PACKAGES" FILES="../files" V=s

    - name: 整理输出
      run: |
        mkdir -p output
        find imagebuilder/bin -name "*sysupgrade*" -exec cp {} output/ \;
        find imagebuilder/bin -name "*factory*" -exec cp {} output/ \;
        find imagebuilder/bin -name "sha256sums" -exec cp {} output/ \;

        echo "=== Output files ==="
        ls -la output/

    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: 智联盒子 v1.0.${{ github.run_number }}
        files: output/*
        body: |
          ## 智联盒子固件 (GL-MT6000)

          **编译信息:**
          - OpenWrt: ${{ env.OPENWRT_VERSION }}
          - 编译时间: ${{ github.event.head_commit.timestamp }}

          **包含功能:**
          - 60个代理客户端支持 (L2TP/SOCKS5)
          - 内网设备绑定
          - 严格网络隔离
          - LuCI 管理界面
          - Watchdog 健康检查

          **刷机方式:**
          - 从官方固件升级: 使用 `*-factory.bin`
          - 从 OpenWrt 升级: 使用 `*-sysupgrade.bin`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
