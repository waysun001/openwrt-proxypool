name: Build 智联盒子 (Fast - ImageBuilder)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt版本'
        required: true
        default: '23.05.3'
        type: choice
        options:
          - '23.05.3'
          - '23.05.2'
      no_cache:
        description: '禁用缓存（调试用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  OPENWRT_VERSION: '23.05.3'
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE_PROFILE: glinet_gl-mt6000
  TZ: Asia/Shanghai

jobs:
  build-packages:
    name: 编译自定义软件包
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: 缓存 APT 包
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: apt-sdk-${{ runner.os }}-v1
        restore-keys: apt-sdk-

    - name: 安装依赖
      run: |
        # 使用缓存的 apt 包
        if [ -d ~/apt-cache ]; then
          sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        fi

        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget ccache

        # 保存 apt 包到缓存
        mkdir -p ~/apt-cache
        cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

    - name: 缓存 OpenWrt SDK
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: sdk
        key: sdk-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.OPENWRT_VERSION }}-v2
        restore-keys: |
          sdk-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.OPENWRT_VERSION }}-

    - name: 下载 OpenWrt SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        SDK_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-sdk-[^"]+\.tar\.xz' | head -1)

        if [ -z "$SDK_FILE" ]; then
          echo "Error: Cannot find SDK file"
          exit 1
        fi

        echo "Downloading: $SDK_FILE"
        wget -q "$BASE_URL/$SDK_FILE"

        echo "Extracting SDK..."
        tar -xf "$SDK_FILE"

        SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -1)
        if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR" ]; then
          mv "$SDK_DIR" sdk
        else
          echo "Error: SDK directory not found"
          ls -la
          exit 1
        fi

    - name: 缓存 Feeds
      id: cache-feeds
      uses: actions/cache@v4
      with:
        path: |
          sdk/feeds
          sdk/staging_dir/host
        key: feeds-sdk-${{ env.OPENWRT_VERSION }}-${{ hashFiles('sdk/feeds.conf.default') }}-v2
        restore-keys: |
          feeds-sdk-${{ env.OPENWRT_VERSION }}-

    - name: 缓存 ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-sdk-${{ env.TARGET }}-${{ github.sha }}
        restore-keys: |
          ccache-sdk-${{ env.TARGET }}-

    - name: 准备软件包源码
      run: |
        mkdir -p sdk/package/proxypool
        cp -r proxypool-core sdk/package/proxypool/
        cp -r luci-app-proxypool sdk/package/proxypool/

    - name: 编译软件包
      run: |
        cd sdk

        # 配置 ccache
        export PATH="/usr/lib/ccache:$PATH"
        export CCACHE_DIR=~/.ccache
        export CCACHE_MAXSIZE=1G
        ccache -z

        # 只在 feeds 未缓存时更新
        if [ ! -d "feeds/luci" ] || [ ! -d "feeds/packages" ]; then
          echo "=== Feeds not cached, updating... ==="

          # 移除 SDK 中不可用的 feed
          sed -i '/telephony/d; /routing/d' feeds.conf.default

          # 将 git.openwrt.org 替换为 GitHub 镜像
          sed -i 's|https://git.openwrt.org/openwrt/openwrt.git|https://github.com/openwrt/openwrt.git|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default

          # 确保 luci feed 存在
          if ! grep -q '^src-git luci' feeds.conf.default; then
            echo "src-git luci https://github.com/openwrt/luci.git;openwrt-23.05" >> feeds.conf.default
          fi

          # 优化 git 配置
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global advice.detachedHead false

          # 只更新必要的 feeds（跳过 telephony/routing）
          ./scripts/feeds update base packages luci || {
            echo "Retry feeds update..."
            sleep 15
            ./scripts/feeds update base packages luci
          }
        else
          echo "=== Using cached feeds ==="
        fi

        ./scripts/feeds install -a

        echo "CONFIG_PACKAGE_proxypool-core=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-proxypool=m" >> .config
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig

        # 并行编译
        make package/proxypool/proxypool-core/compile -j$(nproc) || make package/proxypool/proxypool-core/compile V=s -j1
        make package/proxypool/luci-app-proxypool/compile -j$(nproc) || make package/proxypool/luci-app-proxypool/compile V=s -j1

        mkdir -p ../packages
        find bin -name "*.ipk" -exec cp {} ../packages/ \; 2>/dev/null || true

        echo "=== Built packages ==="
        ls -la ../packages/

        # ccache 统计
        ccache -s

    - name: 上传软件包
      uses: actions/upload-artifact@v4
      with:
        name: proxypool-packages
        path: packages/*.ipk
        if-no-files-found: warn
        retention-days: 1

  build-firmware:
    name: 生成固件
    runs-on: ubuntu-22.04
    needs: build-packages

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: 缓存 APT 包
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: apt-ib-${{ runner.os }}-v1
        restore-keys: apt-ib-

    - name: 安装依赖
      run: |
        if [ -d ~/apt-cache ]; then
          sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        fi

        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

        mkdir -p ~/apt-cache
        cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

    - name: 缓存 ImageBuilder
      id: cache-ib
      uses: actions/cache@v4
      with:
        path: imagebuilder
        key: imagebuilder-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.OPENWRT_VERSION }}-v2
        restore-keys: |
          imagebuilder-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.OPENWRT_VERSION }}-

    - name: 下载 OpenWrt ImageBuilder
      if: steps.cache-ib.outputs.cache-hit != 'true'
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        IB_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-imagebuilder-[^"]+\.tar\.xz' | head -1)

        if [ -z "$IB_FILE" ]; then
          echo "Error: Cannot find ImageBuilder file"
          exit 1
        fi

        echo "Downloading: $IB_FILE"
        wget -q "$BASE_URL/$IB_FILE"

        echo "Extracting ImageBuilder..."
        tar -xf "$IB_FILE"

        IB_DIR=$(ls -d openwrt-imagebuilder-* 2>/dev/null | head -1)
        if [ -n "$IB_DIR" ] && [ -d "$IB_DIR" ]; then
          mv "$IB_DIR" imagebuilder
        else
          echo "Error: ImageBuilder directory not found"
          ls -la
          exit 1
        fi

    - name: 下载自定义软件包
      uses: actions/download-artifact@v4
      with:
        name: proxypool-packages
        path: custom-packages
      continue-on-error: true

    - name: 准备自定义软件包
      run: |
        mkdir -p imagebuilder/packages
        if [ -d "custom-packages" ]; then
          cp custom-packages/*.ipk imagebuilder/packages/ 2>/dev/null || true
          echo "=== Custom packages ==="
          ls -la imagebuilder/packages/
        fi

        cd imagebuilder
        # 清理旧的 custom 源配置，避免重复
        sed -i '/src\/gz custom/d' repositories.conf
        echo "src/gz custom file:packages" >> repositories.conf

    - name: 生成固件
      run: |
        cd imagebuilder

        # 基础包
        PACKAGES="luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn"
        PACKAGES="$PACKAGES luci-lua-runtime luci-compat luci-lib-jsonc"
        PACKAGES="$PACKAGES xl2tpd ppp ppp-mod-pppol2tp kmod-l2tp kmod-pppol2tp"
        PACKAGES="$PACKAGES redsocks"
        PACKAGES="$PACKAGES nftables kmod-nft-tproxy kmod-nft-socket"
        PACKAGES="$PACKAGES ip-full bash conntrack"
        PACKAGES="$PACKAGES openssh-sftp-server nano htop"
        # 自定义包
        PACKAGES="$PACKAGES proxypool-core luci-app-proxypool"

        # 使用多线程
        make image PROFILE="${{ env.DEVICE_PROFILE }}" PACKAGES="$PACKAGES" FILES="../files" -j$(nproc) \
          || make image PROFILE="glinet_gl-mt6000" PACKAGES="$PACKAGES" FILES="../files" -j$(nproc) \
          || make image PROFILE="gl-mt6000" PACKAGES="$PACKAGES" FILES="../files" -j$(nproc)

    - name: 整理输出
      run: |
        mkdir -p output
        find imagebuilder/bin -name "*sysupgrade*" -exec cp {} output/ \; 2>/dev/null || true
        find imagebuilder/bin -name "*factory*" -exec cp {} output/ \; 2>/dev/null || true
        find imagebuilder/bin -name "sha256sums" -exec cp {} output/ \; 2>/dev/null || true

        echo "=== Output files ==="
        ls -la output/

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: 智联盒子_GL-MT6000_${{ github.run_number }}
        path: output/*
        if-no-files-found: error

    - name: 创建 Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: 智联盒子 v1.0.${{ github.run_number }}
        files: output/*
        body: |
          ## 智联盒子固件 (GL-MT6000)

          **编译信息:**
          - OpenWrt: ${{ env.OPENWRT_VERSION }}
          - 编译时间: ${{ github.event.head_commit.timestamp }}

          **包含功能:**
          - 60个代理客户端支持 (L2TP/SOCKS5)
          - 内网设备绑定
          - 严格网络隔离
          - LuCI 管理界面
          - 备份/恢复

          **刷机方式:**
          - 从官方固件升级: 使用 `*-factory.bin`
          - 从 OpenWrt 升级: 使用 `*-sysupgrade.bin`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
