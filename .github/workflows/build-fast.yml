name: Build 智联盒子 (Fast - ImageBuilder)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt版本'
        required: true
        default: '23.05.3'
        type: choice
        options:
          - '23.05.3'
          - '23.05.2'

env:
  OPENWRT_VERSION: '23.05.3'
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE_PROFILE: glinet_gl-mt6000
  TZ: Asia/Shanghai

jobs:
  build-packages:
    name: 编译自定义软件包
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget

    - name: 下载 OpenWrt SDK
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        SDK_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-sdk-[^"]+\.tar\.xz' | head -1)

        if [ -z "$SDK_FILE" ]; then
          echo "Error: Cannot find SDK file"
          exit 1
        fi

        echo "Downloading: $SDK_FILE"
        wget -q "$BASE_URL/$SDK_FILE"

        echo "Extracting SDK..."
        tar -xf "$SDK_FILE"

        SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -1)
        if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR" ]; then
          mv "$SDK_DIR" sdk
        else
          echo "Error: SDK directory not found"
          ls -la
          exit 1
        fi

    - name: 准备软件包源码
      run: |
        mkdir -p sdk/package/proxypool
        cp -r proxypool-core sdk/package/proxypool/
        cp -r luci-app-proxypool sdk/package/proxypool/

    - name: 编译软件包
      run: |
        cd sdk

        # 移除 SDK 中不可用的 feed
        sed -i '/telephony/d; /routing/d' feeds.conf.default

        # 将 git.openwrt.org 替换为 GitHub 镜像（避免 RPC/curl 18 断连）
        sed -i 's|https://git.openwrt.org/openwrt/openwrt.git|https://github.com/openwrt/openwrt.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
        sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default

        # 确保 luci feed 存在（SDK 可能未自带或 URL 失效）
        if ! grep -q '^src-git luci' feeds.conf.default; then
          echo "src-git luci https://github.com/openwrt/luci.git;openwrt-23.05" >> feeds.conf.default
        fi

        echo "=== feeds.conf.default ==="
        cat feeds.conf.default

        # 优化 git 网络配置，防止大仓库克隆中断
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        git config --global advice.detachedHead false

        # 更新 feeds，带重试（最多3次，每次间隔30秒）
        feeds_ok=0
        for attempt in 1 2 3; do
          echo "=== feeds update attempt $attempt ==="
          if ./scripts/feeds update -a; then
            feeds_ok=1
            break
          fi
          echo "Attempt $attempt failed, waiting 30s..."
          sleep 30
        done

        if [ "$feeds_ok" != "1" ]; then
          echo "Error: feeds update failed after 3 attempts"
          exit 1
        fi

        # 验证关键 feeds 目录存在
        for feed_dir in feeds/base feeds/luci feeds/packages; do
          if [ ! -d "$feed_dir" ]; then
            feed_name=$(basename "$feed_dir")
            echo "Warning: $feed_dir not found, retrying $feed_name..."
            ./scripts/feeds update "$feed_name" || { sleep 15 && ./scripts/feeds update "$feed_name"; }
          fi
        done
        ls -la feeds/

        ./scripts/feeds install -a

        echo "CONFIG_PACKAGE_proxypool-core=m" >> .config
        echo "CONFIG_PACKAGE_luci-app-proxypool=m" >> .config
        make defconfig

        make package/proxypool/proxypool-core/compile V=s -j$(nproc) || make package/proxypool/proxypool-core/compile V=s -j1
        make package/proxypool/luci-app-proxypool/compile V=s -j$(nproc) || make package/proxypool/luci-app-proxypool/compile V=s -j1

        mkdir -p ../packages
        find bin -name "*.ipk" -exec cp {} ../packages/ \; 2>/dev/null || true

        echo "=== Built packages ==="
        ls -la ../packages/

    - name: 上传软件包
      uses: actions/upload-artifact@v4
      with:
        name: proxypool-packages
        path: packages/*.ipk
        if-no-files-found: warn

  build-firmware:
    name: 生成固件
    runs-on: ubuntu-22.04
    needs: build-packages

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

    - name: 下载 OpenWrt ImageBuilder
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"

        IB_FILE=$(curl -s "$BASE_URL/" | grep -oE 'openwrt-imagebuilder-[^"]+\.tar\.xz' | head -1)

        if [ -z "$IB_FILE" ]; then
          echo "Error: Cannot find ImageBuilder file"
          exit 1
        fi

        echo "Downloading: $IB_FILE"
        wget -q "$BASE_URL/$IB_FILE"

        echo "Extracting ImageBuilder..."
        tar -xf "$IB_FILE"

        IB_DIR=$(ls -d openwrt-imagebuilder-* 2>/dev/null | head -1)
        if [ -n "$IB_DIR" ] && [ -d "$IB_DIR" ]; then
          mv "$IB_DIR" imagebuilder
        else
          echo "Error: ImageBuilder directory not found"
          ls -la
          exit 1
        fi

    - name: 下载自定义软件包
      uses: actions/download-artifact@v4
      with:
        name: proxypool-packages
        path: custom-packages
      continue-on-error: true

    - name: 准备自定义软件包
      run: |
        mkdir -p imagebuilder/packages
        if [ -d "custom-packages" ]; then
          cp custom-packages/*.ipk imagebuilder/packages/ 2>/dev/null || true
          echo "=== Custom packages ==="
          ls -la imagebuilder/packages/
        fi

        cd imagebuilder
        echo "src/gz custom file:packages" >> repositories.conf
        cat repositories.conf

    - name: 生成固件
      run: |
        cd imagebuilder

        echo "=== Available profiles ==="
        make info | grep -i gl-mt6000 || make info | head -50

        # 基础包
        PACKAGES="luci luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn"
        PACKAGES="$PACKAGES luci-lua-runtime luci-compat luci-lib-jsonc"
        PACKAGES="$PACKAGES xl2tpd ppp ppp-mod-pppol2tp kmod-l2tp kmod-pppol2tp"
        PACKAGES="$PACKAGES redsocks"
        PACKAGES="$PACKAGES nftables kmod-nft-tproxy kmod-nft-socket"
        PACKAGES="$PACKAGES ip-full bash conntrack"
        PACKAGES="$PACKAGES openssh-sftp-server nano htop"
        # 自定义包
        PACKAGES="$PACKAGES proxypool-core luci-app-proxypool"

        make image PROFILE="${{ env.DEVICE_PROFILE }}" PACKAGES="$PACKAGES" FILES="../files" \
          || make image PROFILE="glinet_gl-mt6000" PACKAGES="$PACKAGES" FILES="../files" \
          || make image PROFILE="gl-mt6000" PACKAGES="$PACKAGES" FILES="../files"

    - name: 整理输出
      run: |
        mkdir -p output
        find imagebuilder/bin -name "*sysupgrade*" -exec cp {} output/ \; 2>/dev/null || true
        find imagebuilder/bin -name "*factory*" -exec cp {} output/ \; 2>/dev/null || true
        find imagebuilder/bin -name "sha256sums" -exec cp {} output/ \; 2>/dev/null || true

        echo "=== Output files ==="
        ls -la output/

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: 智联盒子_GL-MT6000_${{ github.run_number }}
        path: output/*
        if-no-files-found: error

    - name: 创建 Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: 智联盒子 v1.0.${{ github.run_number }}
        files: output/*
        body: |
          ## 智联盒子固件 (GL-MT6000)

          **编译信息:**
          - OpenWrt: ${{ env.OPENWRT_VERSION }}
          - 编译时间: ${{ github.event.head_commit.timestamp }}

          **包含功能:**
          - 60个代理客户端支持 (L2TP/SOCKS5)
          - 内网设备绑定
          - 严格网络隔离
          - LuCI 管理界面
          - 备份/恢复

          **刷机方式:**
          - 从官方固件升级: 使用 `*-factory.bin`
          - 从 OpenWrt 升级: 使用 `*-sysupgrade.bin`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
