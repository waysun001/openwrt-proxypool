name: Test ProxyPool

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout full commit range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: proxypool-core/src/proxypoold/go.mod

      - name: Race tests, vet, shell contracts
        run: ./scripts/test-host.sh

      - name: Check event commit range whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || printf '%040d' 0)
          fi
          sh ./scripts/check-whitespace-range.sh "$base" "$EVENT_HEAD_SHA"

      - name: Cross-build Linux arm64 without CGO
        working-directory: proxypool-core/src/proxypoold
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/proxypoold ./cmd/proxypoolctl
